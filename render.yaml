services:
  - type: web
    name: per-carais-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CARAIS_MATCH_THRESHOLD
        value: "0.50"
      - key: CARAIS_ALLOWED_ORIGINS
        value: "https://alfredocespedes-c.github.io"
