# per_carAis — ENTORNO DE DESARROLLO
# vm3: 172.31.2.42
# Backend InsightFace: 127.0.0.1:8301
# Frontend estatico: /home/acespedes/dev/per_carAis/frontend

server {
    listen 80;
    server_name dev-prueba1.conaf.cl;

    access_log /var/log/nginx/dev-prueba1.access.log;
    error_log  /var/log/nginx/dev-prueba1.error.log;

    client_max_body_size 25m;

    root /home/acespedes/dev/per_carAis/frontend;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:8301/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /faces/ {
        proxy_pass http://127.0.0.1:8301/faces/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
